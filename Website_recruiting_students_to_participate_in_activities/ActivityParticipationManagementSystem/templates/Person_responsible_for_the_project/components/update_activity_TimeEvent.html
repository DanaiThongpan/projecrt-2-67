{% load crispy_forms_tags %}
<main class="flex justify-center items-center px-12 py-10 pt-20">
  <div class="w-aoto bg-gray-100 p-8 shadow-lg rounded-lg animate-slide-in-left">
      <h1 class="text-2xl font-bold mb-6 text-center">แก้ไขข้อมูลกิจกรรม</h1>
      <form action="{% url 'update_activity_TimeEvent' activity.id %}" method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form|crispy }}

          <!-- เพิ่มฟิลด์สำหรับ TimeEvent -->
          <h2 class="text-xl font-bold mt-6 mb-4">ข้อมูลวันที่จัดกิจกรรม</h2>
          {% for time_event in time_events %}
              <div class="mb-4">
                  <label class="block text-sm font-medium text-gray-700">สถานที่ (วันที่ {{ forloop.counter }})</label>
                  <input type="text" name="place_{{ time_event.id }}" value="{{ time_event.place }}" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
              </div>
              <div class="mb-4">
                  <label class="block text-sm font-medium text-gray-700">วันที่เริ่ม (วันที่ {{ forloop.counter }})</label>
                  <input type="datetime-local" name="start_date_activity_{{ time_event.id }}" value="{{ time_event.start_date_activity|date:'Y-m-d\TH:i' }}" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
              </div>
              <div class="mb-4">
                  <label class="block text-sm font-medium text-gray-700">วันที่สิ้นสุด (วันที่ {{ forloop.counter }})</label>
                  <input type="datetime-local" name="due_date_activity_{{ time_event.id }}" value="{{ time_event.due_date_activity|date:'Y-m-d\TH:i' }}" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
              </div>
          {% endfor %}

          <div class="text-center">
              <button type="submit" class="w-full px-4 py-2 bg-blue-400 text-white rounded-md hover:bg-blue-700 focus:outline-none focus:bg-blue-700">
                บันทึกการแก้ไข
              </button>
          </div>
      </form>
  </div>
</main>
