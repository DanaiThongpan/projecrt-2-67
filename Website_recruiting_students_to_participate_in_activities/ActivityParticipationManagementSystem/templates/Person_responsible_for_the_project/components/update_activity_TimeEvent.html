{% load crispy_forms_tags %}
<main class="flex justify-center items-center px-4 py-10 pt-20 min-h-screen">
  <div class="max-w-xl w-full bg-white p-8 shadow-2xl rounded-lg animate-slide-in-left">
      <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">📝 แก้ไขข้อมูลกิจกรรมและกำหนดการ</h1>
      
      <form action="{% url 'update_activity_TimeEvent' activity_id=activity.id %}" method="post" enctype="multipart/form-data">
          {% csrf_token %}
          
          {{ form|crispy }} 

          <h2 class="text-xl font-bold mt-6 mb-4 text-gray-700 border-t pt-4">📅 ข้อมูลวันที่จัดกิจกรรม</h2>
          
          {% for time_event in time_events %}
              <div class="border border-gray-200 p-4 rounded-lg mb-6 bg-gray-50">
                  <h3 class="text-lg font-semibold text-blue-600 mb-3">ช่วงที่ {{ forloop.counter }}</h3>
                  
                  <div class="mb-4">
                      <label class="block text-sm font-medium text-gray-700">สถานที่ (ช่วงที่ {{ forloop.counter }})</label>
                      <input type="text" name="place_{{ time_event.id }}" value="{{ time_event.place|default:'' }}" 
                             class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                  </div>
                  
                  <div class="mb-4">
                      <label class="block text-sm font-medium text-gray-700">วันที่เริ่ม (ช่วงที่ {{ forloop.counter }})</label>
                      <input type="datetime-local" name="start_date_activity_{{ time_event.id }}" value="{{ time_event.start_date_activity|date:'Y-m-d\TH:i' }}" 
                             class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                  </div>
                  
                  <div class="mb-4">
                      <label class="block text-sm font-medium text-gray-700">วันที่สิ้นสุด (ช่วงที่ {{ forloop.counter }})</label>
                      <input type="datetime-local" name="due_date_activity_{{ time_event.id }}" value="{{ time_event.due_date_activity|date:'Y-m-d\TH:i' }}" 
                             class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                  </div>
              </div>
          {% endfor %}

          <div class="text-center mt-6">
              <button type="submit" class="w-full px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 focus:outline-none focus:ring-4 focus:ring-blue-300 transition duration-150">
                บันทึกการแก้ไข
              </button>
          </div>
      </form>
  </div>
</main>
